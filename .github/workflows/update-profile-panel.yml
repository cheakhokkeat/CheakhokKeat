name: Update Profile Panel

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:00 in Cambodia (17:00 UTC on the previous day).
    - cron: "0 17 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-profile-panel.yml"
      - "scripts/generate_profile_panel.py"
      - "assets/profile-avatar.jpg"

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image decoder
        run: python -m pip install Pillow

      - name: Refresh GitHub portrait and generate panel
        if: github.event_name != 'push'
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_panel.py --github-user "$GH_USERNAME"

      - name: Rebuild from committed portrait
        if: github.event_name == 'push'
        run: python scripts/generate_profile_panel.py

      - name: Commit changed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-avatar.jpg assets/profile-panel.svg assets/wave-divider.svg
          if git diff --cached --quiet; then
            echo "Profile images are unchanged."
          else
            git commit -m "Update profile portrait and wave panel"
            git pull --rebase
            git push
          fi
